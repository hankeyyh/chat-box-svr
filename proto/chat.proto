syntax = "proto3";

package chat;
option go_package = "./chat";

message ChatRequest {
    string text = 1;
    uint64 session_id = 2;
}

message ChatResponse {
    int32 code = 1;
    string message = 2;
    ChatResponseData data = 3;
}

message ChatResponseData {
    string text = 1;
    uint64 session_id = 2; // 如果request中session_id=0，这里返回创建的session_id。否则和request中的session_id一致
}

service ChatService {
    rpc ChatStream(ChatRequest) returns (stream ChatResponse);
}