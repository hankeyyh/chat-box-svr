syntax = "proto3";

package chat;
option go_package = "./chat";

message ChatRequest {
    string text = 1;
}

message ChatResponse {
    int32 code = 1;
    string message = 2;
    ChatResponseData data = 3;
}

message ChatResponseData {
    string text = 1;
}

service ChatService {
    rpc ChatStream(ChatRequest) returns (stream ChatResponse);
}